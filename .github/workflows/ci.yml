name: CI - FISEI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - Build y Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Ejecutar pruebas Vitest
        run: npm test -- --run

  backend:
    name: Backend - Build y xUnit
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore backend/HomologacionesFISEI.sln

      - name: Compilar backend
        run: dotnet build backend/HomologacionesFISEI.sln --configuration Release --no-restore

      - name: Ejecutar pruebas xUnit
        run: dotnet test backend/HomologacionesFISEI.sln --configuration Release --no-build
